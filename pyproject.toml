[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mapd-reproduction"
version = "0.1.0"
description = "A modular reproduction scaffold for Multi-Agent Protocol Distillation"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "PyYAML>=6.0,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7"]
data = ["huggingface-hub>=0.28,<2", "pyarrow>=17,<22"]

[project.scripts]
mapd = "mapd.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
